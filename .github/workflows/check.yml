name: Checks

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build_images:
    name: Build images
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/component-build-images.yml
    with:
      push: ${{ github.event_name == 'push' }}
      force_build: ${{ github.event_name == 'push' }}
      version: ${{ github.event_name == 'push' && 'main' || 'dev' }}
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: npm ci

      - name: Run markdownlint
        run: |
          if ! npm ls markdownlint; then
            npm install
          fi

          while IFS= read -r file; do
            echo "$file"
            npx --no -p markdownlint-cli markdownlint -c .markdownlint.yaml "$file" || exit 1
          done < <(
            find . -type f -name '*.md' \
              -not -path './.github/*' \
              -not -path '*/node_modules/*' \
              -not -path '*/_build/*' \
              -not -path '*/deps/*' \
              -not -path '*/Pods/*' \
              -not -path '*/.expo/*' \
              | sort
          )

  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: yamllint --version >/dev/null 2>&1 || pip install -U yamllint~=1.30.0

      - name: Run yamllint
        run: yamllint . -f github --strict

  misspell:
    name: Misspell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build misspell
        run: |
          cd ./internal/tools
          go build -o bin/misspell github.com/client9/misspell/cmd/misspell

      - name: Run misspell
        run: |
          mapfile -t ALL_DOCS < <(
            find . -type f -name '*.md' \
              -not -path './.github/*' \
              -not -path '*/node_modules/*' \
              -not -path '*/_build/*' \
              -not -path '*/deps/*' \
              -not -path '*/Pods/*' \
              -not -path '*/.expo/*' \
              | sort
          )

          ./internal/tools/bin/misspell -error "${ALL_DOCS[@]}"

  checklinks:
    name: lychee
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Restore lychee cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache-restore
        with:
          path: .lycheecache
          key: ${{ runner.os }}-lychee-${{ hashFiles('.lychee.toml') }}
          restore-keys: |
            ${{ runner.os }}-lychee-

      - name: Run lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: --config .lychee.toml --cache --max-cache-age 3d --cache-exclude-status 300..=599 .
          fail: true

      - name: Save lychee cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lycheecache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

  sanity:
    name: Sanity check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run sanitycheck.py
        run: python3 ./internal/tools/sanitycheck.py

  checklicense:
    name: Check license
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build addlicense
        run: |
          cd ./internal/tools
          go build -o bin/addlicense github.com/google/addlicense

      - name: Run checklicense
        run: |
          ./internal/tools/bin/addlicense -check -c "The OpenTelemetry Authors" -l apache -s=only -y "" \
            -ignore node_modules/** \
            -ignore .expo/** \
            -ignore Pods/** \
            -ignore ".chloggen/**" \
            -ignore **/extras/** \
            -ignore **/vendor/** \
            -ignore **/.venv/** \
            -ignore **/dist/** \
            -ignore **/build/** \
            -ignore **/*_pb2.py \
            -ignore **/*_pb2_grpc.py \
            -ignore **/genproto/** \
            -ignore **/protos/*.ts \
            .

  # Validates that every fragment in .chloggen/ is well-formed.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'

      - name: Validate changelog fragments
        run: go run go.opentelemetry.io/build-tools/chloggen@v0.30.0 validate --config .chloggen/config.yaml

  weaver-check:
    name: Weaver check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run Weaver registry check
        env:
          GITHUB_WORKSPACE_PATH: ${{ github.workspace }}
        run: |
          WEAVER_IMAGE=$(grep -oP '(?<=^FROM )\S*otel/weaver\S*' src/telemetry-docs/Dockerfile)
          docker run --rm \
            --mount "type=bind,source=${GITHUB_WORKSPACE_PATH}/telemetry-schema,target=/home/weaver/source,readonly" \
            "${WEAVER_IMAGE}" \
            registry check -r source

  check-react-native-changes:
    name: Check React Native changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.filter.outputs.react_native }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check React Native paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            react_native:
              - 'src/react-native-app/**'
              - 'Makefile'
              - '.github/workflows/checks.yml'
              - '.github/workflows/react-native-build.yml'

  react-native-build:
    needs: check-react-native-changes
    if: needs.check-react-native-changes.outputs.should_build == 'true'
    uses: ./.github/workflows/react-native-build.yml

  codeql-analysis:
    name: CodeQL analysis
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql-analysis.yml

  build-test:
    name: build-test
    needs:
      - build_images
      - markdownlint
      - yamllint
      - misspell
      - checklinks
      - sanity
      - checklicense
      - changelog
      - weaver-check
      - react-native-build
      - codeql-analysis
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Report CI status
        shell: bash
        env:
          CI_SUCCESS: ${{ !contains(needs.*.result, 'failure') }}
        run: |
          if [ "${CI_SUCCESS}" == "true" ]
          then
            echo 'Build complete ✓'
          else
            echo 'Build failed ✗'
            exit 1
          fi
